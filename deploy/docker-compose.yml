# hostwatch Linux agent. It collects on this host and sends OTLP to Observe; it serves nothing.
#
# network_mode host: the agent reaches Scrutiny, a NUT server or a TrueNAS API on localhost
# without published ports. The Observe URL and the ingest key come from .env (copy
# .env.example, mode 0600); no secret value is stored in this file.
services:
  hostwatch:
    build: ..
    # Pulls the CI-built image; "docker compose build" still builds locally.
    image: ghcr.io/trooperthorn/hostwatch:edge
    container_name: hostwatch
    restart: unless-stopped
    network_mode: host
    env_file: .env
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    group_add:
      - "${HOSTWATCH_RAPL_GID:?run scripts/rapl-access.sh and set HOSTWATCH_RAPL_GID in .env}"
      - "${HOSTWATCH_JOURNAL_GID:?set HOSTWATCH_JOURNAL_GID in .env from: getent group systemd-journal | cut -d: -f3}"
    volumes:
      - /sys:/host/sys:ro
      # Phase 2 event sources, all read-only. The container paths match the
      # defaults in hostwatch/config.py. The host /proc is deliberately not mounted.
      - /var/log/journal:/host/journal:ro
      - /run/log/journal:/host/journal-volatile:ro
      - /sys/fs/pstore:/host/pstore:ro
      - /var/lib/rasdaemon:/host/rasdaemon:ro
      - hostwatch-data:/data

volumes:
  hostwatch-data:
