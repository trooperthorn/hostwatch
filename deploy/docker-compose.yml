# hostwatch, single-container "all" role (hub + Linux agent).
#
# network_mode host: the agent reaches Scrutiny on localhost, and the hub binds
# to 127.0.0.1 only (HOSTWATCH_HUB_BIND). Nothing is reachable off-host in
# Phase 1. Do not change the bind address before Phase 3 adds authentication.
services:
  hostwatch:
    build: ..
    # Pulls the CI-built image; "docker compose build" still builds locally.
    image: ghcr.io/trooperthorn/hostwatch:edge
    container_name: hostwatch
    restart: unless-stopped
    network_mode: host
    env_file: .env
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    group_add:
      - "${HOSTWATCH_RAPL_GID:?run scripts/rapl-access.sh and set HOSTWATCH_RAPL_GID in .env}"
    volumes:
      - /sys:/host/sys:ro
      - hostwatch-data:/data

volumes:
  hostwatch-data:
