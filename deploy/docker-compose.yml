# hostwatch, single-container "all" role (hub + Linux agent).
#
# network_mode host: the agent reaches Scrutiny on localhost, and the hub binds
# to 127.0.0.1 by default (HOSTWATCH_HUB_BIND). The bind address is exposure
# control, not authentication. The hub refuses a non-loopback bind unless
# HOSTWATCH_TLS_CERT and HOSTWATCH_TLS_KEY are set (mount the files read-only
# and use container paths) or HOSTWATCH_ALLOW_INSECURE_BIND=1 is set.
services:
  hostwatch:
    build: ..
    # Pulls the CI-built image; "docker compose build" still builds locally.
    image: ghcr.io/trooperthorn/hostwatch:edge
    container_name: hostwatch
    restart: unless-stopped
    network_mode: host
    env_file: .env
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    group_add:
      - "${HOSTWATCH_RAPL_GID:?run scripts/rapl-access.sh and set HOSTWATCH_RAPL_GID in .env}"
      - "${HOSTWATCH_JOURNAL_GID:?set HOSTWATCH_JOURNAL_GID in .env from: getent group systemd-journal | cut -d: -f3}"
    volumes:
      - /sys:/host/sys:ro
      # Phase 2 event sources, all read-only. The container paths match the
      # defaults in hostwatch/config.py. The host /proc is deliberately not mounted.
      - /var/log/journal:/host/journal:ro
      - /run/log/journal:/host/journal-volatile:ro
      - /sys/fs/pstore:/host/pstore:ro
      - /var/lib/rasdaemon:/host/rasdaemon:ro
      - hostwatch-data:/data

volumes:
  hostwatch-data:
