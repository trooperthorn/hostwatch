[project]
name = "hostwatch"
version = "0.1.0"
description = "Host health, power, and crash agent that sends OpenTelemetry data to Observe"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "websockets>=13",
]

[project.optional-dependencies]
test = ["pytest>=8", "cryptography>=42"]
# Command signature checks for hostwatch-control. The collector image does not need it.
control = ["cryptography>=42"]
# The Windows service host. The marker keeps it out of Linux and container installs.
windows = ["pywin32>=306; sys_platform == 'win32'"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hostwatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
